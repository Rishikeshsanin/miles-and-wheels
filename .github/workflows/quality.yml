name: V2 quality
on:
  push:
    branches: [v2/frontend-flagship]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for file in assets/js/*.js api/*.js; do node --check "$file"; done
      - name: Product structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          pages=['index.html','fleet.html','vehicle.html','compare.html','experiences.html','cities.html','business.html','support.html']
          class P(HTMLParser): pass
          for name in pages:
              text=Path(name).read_text(); P().feed(text)
              assert 'assets/css/v2.css' in text and 'assets/js/site.js' in text
          data=Path('assets/js/vehicles.js').read_text()
          matches=re.findall(r"\['[^']+','[^']+','[^']+','(car|bike|scooter)'",data)
          assert len(matches)==60, len(matches)
          assert matches.count('car')==32 and matches.count('bike')==18 and matches.count('scooter')==10
          customer=' '.join(Path(x).read_text().lower() for x in pages)
          for forbidden in ['privacy in v1','showcase build','demo booking','display only']:
              assert forbidden not in customer, forbidden
          assert 'homeHeroCarousel' in Path('index.html').read_text()
          assert 'compareBar' in Path('fleet.html').read_text()
          site=Path('assets/js/site.js').read_text()
          for token in ['mw-utility-bar','mwGlobalSearch','mwLocationControl','mwPromo']:
              assert token in site
          print('V2 structure OK')
          PY
      - name: Stateless quote API
        run: |
          node <<'NODE'
          const handler=require('./api/quote.js');
          function call(body){return new Promise(resolve=>{const out={};const req={method:'POST',body};const res={setHeader(){},status(c){out.status=c;return this},json(d){out.data=d;resolve(out)}};handler(req,res)})}
          (async()=>{let r=await call({items:[{id:'swift',quantity:2,days:3},{id:'activa6g',quantity:1,days:2}]});if(r.status!==200||!r.data.ok||r.data.storage!=='none')process.exit(1);r=await call({items:[{id:'swift',quantity:1.5,days:2}]});if(r.status!==400)process.exit(1);console.log('Quote API OK')})()
          NODE
